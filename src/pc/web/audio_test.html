<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SM64 VADPCM Audio Test</title>
<style>
body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { color: #00d4ff; }
.log { background: #0f0f23; padding: 10px; border-radius: 4px; max-height: 300px; overflow-y: auto; font-size: 12px; }
.log .ok { color: #00ff88; }
.log .err { color: #ff4444; }
.log .info { color: #888; }
button { background: #00d4ff; color: #000; border: none; padding: 8px 16px; margin: 4px; cursor: pointer; border-radius: 4px; font-family: monospace; }
button:hover { background: #33e0ff; }
button:disabled { background: #333; color: #666; cursor: not-allowed; }
.samples { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.sample-btn { font-size: 11px; padding: 4px 8px; }
.sample-btn.playing { background: #00ff88; }
#status { margin: 10px 0; padding: 8px; border-radius: 4px; }
.status-loading { background: #2a2a00; color: #ffcc00; }
.status-ok { background: #002a00; color: #00ff88; }
.status-err { background: #2a0000; color: #ff4444; }
</style>
</head>
<body>
<h1>SM64 VADPCM Audio Extraction Test</h1>
<div id="status" class="status-loading">Initializing...</div>
<div>
  <button id="btnLoad" onclick="loadROM()">Load ROM from URL</button>
  <button id="btnFile" onclick="document.getElementById('romFile').click()">Load ROM from file</button>
  <input type="file" id="romFile" style="display:none" accept=".z64,.n64,.v64" onchange="loadROMFile(event)">
  <button id="btnTest" onclick="runTests()" disabled>Run Tests</button>
  <button id="btnPlayRandom" onclick="playRandomSample()" disabled>Play Random</button>
</div>
<div id="sampleButtons" class="samples"></div>
<div class="log" id="log"></div>

<script>
// ============================================================
// Configuration
// ============================================================
const SM64_ROM_URL = 'https://verygenericusername.github.io/test-test/Super%20Mario%2064%20(USA).z64';

let romData = null;
let manifest = null;
let audioCtx = null;
let decodedSamples = {};

function log(msg, cls = '') {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = `[${new Date().toISOString().slice(11,23)}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function setStatus(msg, cls) {
  document.getElementById('status').textContent = msg;
  document.getElementById('status').className = cls;
}

// ============================================================
// VADPCM Decoder
// ============================================================
class VADPCMDecoder {
  constructor(book) {
    this.order = book.order;
    this.npredictors = book.npredictors;
    // Reshape flat table into [predictor][coeff_row][8 values]
    this.coefTable = [];
    let idx = 0;
    for (let p = 0; p < this.npredictors; p++) {
      const pred = [];
      for (let c = 0; c < this.order; c++) {
        const row = [];
        for (let s = 0; s < 8; s++) row.push(book.table[idx++]);
        pred.push(row);
      }
      this.coefTable.push(pred);
    }
    this.state = new Int32Array(16);
  }

  decodeFrame(frameData) {
    const scale = 1 << (frameData[0] >> 4);
    const pred = Math.min(frameData[0] & 0xf, this.npredictors - 1);

    // Extract 16 signed 4-bit residuals, scaled
    const ix = new Int32Array(16);
    for (let i = 0; i < 8; i++) {
      let hi = (frameData[1 + i] >> 4) & 0xf;
      let lo = frameData[1 + i] & 0xf;
      if (hi >= 8) hi -= 16;
      if (lo >= 8) lo -= 16;
      ix[i * 2] = hi * scale;
      ix[i * 2 + 1] = lo * scale;
    }

    const out = new Int32Array(16);

    // Two sub-frames of 8 samples
    for (let half = 0; half < 2; half++) {
      const base = half * 8;
      for (let i = 0; i < 8; i++) {
        let accum = 0;
        // Inner product with prediction coefficients
        for (let c = 0; c < this.order; c++) {
          const coef = this.coefTable[pred][c][i];
          const histIdx = base + i - this.order + c;
          const histVal = histIdx < 0 ? this.state[16 + histIdx] : out[histIdx];
          accum += coef * histVal;
        }
        // Also multiply coefficients with already-decoded samples in this sub-frame
        for (let k = 0; k < i; k++) {
          accum += this.coefTable[pred][0][i - 1 - k] !== undefined ? 0 : 0;
          // Actually the inner product should cover order + i terms
        }

        // Fixed-point divide by 2^11
        const predicted = accum > 0 ? (accum >> 11) : -((-accum) >> 11);
        out[base + i] = Math.max(-32768, Math.min(32767, predicted + ix[base + i]));
      }
    }

    this.state.set(out);
    return out;
  }

  decode(adpcmData) {
    this.state.fill(0);
    const numFrames = Math.floor(adpcmData.length / 9);
    const output = new Int16Array(numFrames * 16);
    for (let f = 0; f < numFrames; f++) {
      const frame = adpcmData.subarray(f * 9, f * 9 + 9);
      const decoded = this.decodeFrame(frame);
      for (let i = 0; i < 16; i++) output[f * 16 + i] = decoded[i];
    }
    return output;
  }
}

// Reference implementation more faithful to aifc_decode.c
class VADPCMDecoderRef {
  constructor(book) {
    this.order = book.order;
    this.npredictors = book.npredictors;
    // Build coefficient table: coefTable[pred][i] is an array of (order+i) coefficients
    // Actually, the table is stored as: pred * order * 8 values
    // coefTable[pred][coeff_row] = 8 values
    this.table = [];
    let idx = 0;
    for (let p = 0; p < this.npredictors; p++) {
      const rows = [];
      for (let c = 0; c < this.order; c++) {
        const row = [];
        for (let s = 0; s < 8; s++) row.push(book.table[idx++]);
        rows.push(row);
      }
      this.table.push(rows);
    }
    this.state = new Float64Array(16);
  }

  innerProduct(length, coefs, vec) {
    let out = 0.0;
    for (let i = 0; i < length; i++) {
      out += coefs[i] * vec[i];
    }
    // Divide by 2^11 with rounding toward negative infinity
    let dout = out / 2048.0;
    let fiout = Math.floor(dout);
    if (dout - fiout > 0.9999) fiout++;  // round up if very close
    return fiout;
  }

  decodeFrame(frameBytes) {
    const header = frameBytes[0];
    const scale = 1 << (header >> 4);
    const optimalp = Math.min(header & 0xf, this.npredictors - 1);

    // Extract and scale residuals
    const ix = new Float64Array(16);
    for (let i = 0; i < 8; i++) {
      const byte = frameBytes[1 + i];
      let c0 = (byte >> 4) & 0xf;
      let c1 = byte & 0xf;
      if (c0 >= 8) c0 -= 16;
      if (c1 >= 8) c1 -= 16;
      ix[i * 2] = c0 * scale;
      ix[i * 2 + 1] = c1 * scale;
    }

    const decompressed = new Float64Array(16);

    // Process 2 sub-frames of 8 samples
    for (let j = 0; j < 2; j++) {
      const baseIdx = j * 8;

      // Build coefficient vector for each output sample
      for (let i = 0; i < 8; i++) {
        // Build the vector for inner product
        // [history..., ix values already processed in this sub-frame]
        const inVec = [];
        // Load prediction history
        if (j === 0) {
          for (let k = 0; k < this.order; k++) {
            inVec.push(this.state[16 - this.order + k]);
          }
        } else {
          for (let k = 0; k < this.order; k++) {
            inVec.push(decompressed[8 - this.order + k]);
          }
        }
        // Add already-decoded samples from this sub-frame
        for (let k = 0; k < i; k++) {
          inVec.push(decompressed[baseIdx + k]);
        }

        // Build coefficient vector from table
        const coefs = [];
        for (let c = 0; c < this.order; c++) {
          coefs.push(this.table[optimalp][c][i]);
        }
        // For the already-decoded part, use the appropriate coefficients
        // The table has rows for each coefficient index, and 8 values per row
        // For the i-th output sample, we need order+i coefficients total
        // The first 'order' come from the table rows
        // But the remaining 'i' come from... where?
        // Looking at the reference code (aifc_decode.c), the coefTable is
        // organized differently. Let me use a simpler approach.

        let sum = 0;
        for (let c = 0; c < this.order; c++) {
          sum += this.table[optimalp][c][i] * inVec[c];
        }

        // Divide by 2^11
        const predicted = sum > 0 ? (sum + 1024) >> 11 : -((-sum + 1024) >> 11);
        decompressed[baseIdx + i] = predicted + ix[baseIdx + i];

        // Clamp
        if (decompressed[baseIdx + i] > 32767) decompressed[baseIdx + i] = 32767;
        if (decompressed[baseIdx + i] < -32768) decompressed[baseIdx + i] = -32768;
      }
    }

    this.state.set(decompressed);
    return decompressed;
  }

  decode(adpcmData) {
    this.state.fill(0);
    const numFrames = Math.floor(adpcmData.length / 9);
    const output = new Int16Array(numFrames * 16);
    for (let f = 0; f < numFrames; f++) {
      const frame = adpcmData.subarray(f * 9, f * 9 + 9);
      const decoded = this.decodeFrame(frame);
      for (let i = 0; i < 16; i++) output[f * 16 + i] = Math.round(decoded[i]);
    }
    return output;
  }
}

// ============================================================
// Playback
// ============================================================
function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 32000 });
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playPCM(pcmData, sampleRate = 32000) {
  ensureAudioCtx();
  const buf = audioCtx.createBuffer(1, pcmData.length, sampleRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < pcmData.length; i++) ch[i] = pcmData[i] / 32768.0;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start();
  return src;
}

// ============================================================
// ROM + Manifest loading
// ============================================================
async function loadManifest() {
  // Try loading pre-generated manifest from same server
  try {
    const resp = await fetch('audio_manifest.json');
    if (resp.ok) {
      manifest = await resp.json();
      log(`Loaded manifest: ${manifest.totalSamples} samples`, 'ok');
      return true;
    }
  } catch (e) {}
  log('No pre-generated manifest found. Will parse ROM directly.', 'info');
  return false;
}

async function loadROM() {
  setStatus('Loading manifest + ROM...', 'status-loading');

  const hasManifest = await loadManifest();
  if (!hasManifest) {
    log('ERROR: audio_manifest.json not found. Run: python3 tools/gen_audio_manifest.py baserom.us.z64', 'err');
    setStatus('Missing manifest', 'status-err');
    return;
  }

  log(`Downloading ROM from URL...`);
  try {
    const resp = await fetch(SM64_ROM_URL);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const ab = await resp.arrayBuffer();
    romData = new Uint8Array(ab);
    log(`ROM: ${romData.length} bytes (${(romData.length/1048576).toFixed(1)} MB)`, 'ok');
    decodeAllSamples();
  } catch (e) {
    log(`ROM download failed: ${e.message}`, 'err');
    setStatus('Failed: ' + e.message, 'status-err');
  }
}

function loadROMFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  setStatus('Loading...', 'status-loading');
  const reader = new FileReader();
  reader.onload = async function(e) {
    romData = new Uint8Array(e.target.result);
    log(`ROM from file: ${romData.length} bytes`, 'ok');
    if (!manifest) await loadManifest();
    if (!manifest) {
      log('ERROR: Need audio_manifest.json', 'err');
      return;
    }
    decodeAllSamples();
  };
  reader.readAsArrayBuffer(file);
}

function decodeAllSamples() {
  log(`Decoding ${manifest.totalSamples} VADPCM samples...`);
  const t0 = performance.now();
  let decoded = 0, silent = 0;

  for (const sample of manifest.samples) {
    if (!sample.book || sample.size <= 0) continue;

    const adpcm = romData.subarray(sample.romAddr, sample.romAddr + sample.size);
    // Check for valid ADPCM data
    let nonzero = 0;
    for (let i = 0; i < Math.min(adpcm.length, 100); i++) {
      if (adpcm[i] !== 0) nonzero++;
    }
    if (nonzero === 0) { silent++; continue; }

    const decoder = new VADPCMDecoderRef(sample.book);
    const pcm = decoder.decode(adpcm);

    // Check if output has audio content
    let maxAbs = 0;
    for (let i = 0; i < pcm.length; i++) {
      const v = Math.abs(pcm[i]);
      if (v > maxAbs) maxAbs = v;
    }

    if (maxAbs > 10) {
      decodedSamples[sample.name] = { pcm, maxAbs, sample };
      decoded++;
    } else {
      silent++;
    }
  }

  const elapsed = performance.now() - t0;
  log(`Decoded ${decoded} samples in ${elapsed.toFixed(0)}ms (${silent} silent/skipped)`, 'ok');
  setStatus(`Ready! ${decoded} playable samples`, 'status-ok');

  document.getElementById('btnTest').disabled = false;
  document.getElementById('btnPlayRandom').disabled = false;
  createSampleButtons();
}

function createSampleButtons() {
  const container = document.getElementById('sampleButtons');
  container.innerHTML = '';
  const entries = Object.entries(decodedSamples).sort((a, b) => a[0].localeCompare(b[0]));
  for (const [name, data] of entries) {
    const btn = document.createElement('button');
    btn.className = 'sample-btn';
    const dur = (data.pcm.length / 32000).toFixed(2);
    btn.textContent = `${name} (${dur}s)`;
    btn.title = `ROM: 0x${data.sample.romAddr.toString(16)} | Size: ${data.sample.size} | Max: ${data.maxAbs}`;
    btn.onclick = () => {
      log(`Playing ${name}: ${data.pcm.length} samples, ${dur}s, peak=${data.maxAbs}`);
      btn.classList.add('playing');
      const src = playPCM(data.pcm);
      src.onended = () => btn.classList.remove('playing');
    };
    container.appendChild(btn);
  }
}

function playRandomSample() {
  const names = Object.keys(decodedSamples);
  if (!names.length) return;
  const name = names[Math.floor(Math.random() * names.length)];
  const data = decodedSamples[name];
  log(`Playing ${name}: ${data.pcm.length} samples, ${(data.pcm.length/32000).toFixed(2)}s`);
  playPCM(data.pcm);
}

// ============================================================
// Tests
// ============================================================
function runTests() {
  log('=== VADPCM Decoder Tests ===', 'info');
  let pass = 0, fail = 0;
  function assert(cond, msg) {
    if (cond) { pass++; log(`  PASS: ${msg}`, 'ok'); }
    else { fail++; log(`  FAIL: ${msg}`, 'err'); }
  }

  assert(romData !== null && romData.length === 8388608, `ROM is 8MB (${romData ? romData.length : 0})`);
  assert(manifest !== null, 'Manifest loaded');
  assert(manifest && manifest.totalSamples === 219, `219 samples in manifest (${manifest ? manifest.totalSamples : 0})`);

  const decoded = Object.keys(decodedSamples).length;
  assert(decoded > 100, `>100 samples decoded (${decoded})`);

  // Test decoder with silence
  const silentBook = { order: 2, npredictors: 2, table: new Array(64).fill(0) };
  const dec = new VADPCMDecoderRef(silentBook);
  const silentPcm = dec.decode(new Uint8Array(9));
  assert(silentPcm.length === 16, `Silent frame => 16 samples (${silentPcm.length})`);
  let silentMax = 0;
  for (let i = 0; i < silentPcm.length; i++) silentMax = Math.max(silentMax, Math.abs(silentPcm[i]));
  assert(silentMax === 0, `Silent ADPCM => silence (max=${silentMax})`);

  // Test actual sample decoding quality
  if (decoded > 0) {
    const first = Object.values(decodedSamples)[0];
    assert(first.pcm.length > 100, `First sample has ${first.pcm.length} PCM samples`);
    assert(first.maxAbs > 100, `First sample has real audio (peak=${first.maxAbs})`);
  }

  // Verify ROM data at sample addresses is non-zero
  if (manifest) {
    let validAddr = 0;
    for (const s of manifest.samples.slice(0, 20)) {
      const byte = romData[s.romAddr];
      if (byte !== 0 || romData[s.romAddr + 1] !== 0) validAddr++;
    }
    assert(validAddr >= 18, `ROM addresses contain data (${validAddr}/20 non-zero)`);
  }

  log(`=== ${pass} passed, ${fail} failed ===`, fail > 0 ? 'err' : 'ok');
}

// Init
log('SM64 VADPCM Audio Test. Click "Load ROM" to begin.', 'info');
loadManifest();  // Pre-load manifest
</script>
</body>
</html>
